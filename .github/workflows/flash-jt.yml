name: Flash Info JT (Rachid + Pexels)

# Flash de 3 sujets : accueil et clôture de Rachid (bibliothèque d'Agnes), sujets en voix
# off Henri illustrés par Pexels, musique et jingles. Aucune génération Agnes, aucun PC.
# Publication directe dans le widget « Flash Info » du site (retrait en 1 clic avec
# « Vrai flash — retirer le dernier »). Un flash raté n'est jamais publié : le précédent reste.
#
# Lancement automatique à 7 h, 12 h et 16 h (heure d'Algérie, UTC+1) + lancement manuel possible.
on:
  schedule:
    - cron: "0 6,11,15 * * *"
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier sur le site (oui) ou seulement fabriquer la vidéo (non)"
        default: "oui"

permissions:
  contents: write

concurrency:
  group: express
  cancel-in-progress: false

jobs:
  flash:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Dépôt du site
        uses: actions/checkout@v4
        with:
          repository: bastaps/algeria-tech
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          fetch-depth: 1

      - name: Dépôt des vidéos (bibliothèque de Rachid + flashs)
        uses: actions/checkout@v4
        with:
          repository: bastaps/algeria-tech-videos
          ssh-key: ${{ secrets.VIDEOS_DEPLOY_KEY }}
          path: videos-repo
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Outils (ffmpeg, polices)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q edge-tts feedparser requests beautifulsoup4 pillow

      - name: Routeur IA gratuit (FreeLLMAPI)
        continue-on-error: true  # en cas d'échec : appel direct à Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/llm/demarrer_freellmapi.sh

      - name: Fabrication du flash
        id: fab
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          RACHID_BIBLIOTHEQUE: videos-repo/rachid
        run: |
          set +e
          python scripts/express/flash_jt.py --sortie flash-out
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ $code -eq 0 ] && echo "ok=oui" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Notification si rien n'est fabriqué
        if: steps.fab.outputs.ok != 'oui'
        env:
          CANAL: ${{ secrets.NTFY_TOPIC }}
          CODE: ${{ steps.fab.outputs.code }}
        run: |
          python3 - <<'EOF'
          import os, urllib.request
          if os.environ["CODE"] == "2":
              titre, msg = "ℹ️ Pas de flash", "Pas assez d'infos tech nouvelles depuis le dernier flash. Le flash précédent reste en ligne."
          else:
              titre, msg = "❌ Flash non publié", "La fabrication du flash a échoué. Le flash précédent reste en ligne."
          urllib.request.urlopen(urllib.request.Request(f"https://ntfy.sh/{os.environ['CANAL']}", data=msg.encode(),
              headers={"Title": titre.encode("utf-8")}), timeout=20)
          EOF

      - name: Vidéo en artefact (relecture)
        if: steps.fab.outputs.ok == 'oui'
        uses: actions/upload-artifact@v4
        with:
          name: flash-jt
          path: flash-out/
          retention-days: 7

      - name: Publication sur le site
        if: steps.fab.outputs.ok == 'oui' && github.event.inputs.publier != 'non'
        env:
          CANAL: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 - <<'EOF'
          import glob, json, os, shutil, subprocess, sys, urllib.request
          from datetime import datetime, timezone, timedelta
          meta_p = sorted(glob.glob("flash-out/flashjt-*.json"))[-1]
          meta = json.load(open(meta_p, encoding="utf-8"))
          video = os.path.join("flash-out", meta["video"])
          ident = meta["video"].replace("flashjt-", "").replace(".mp4", "")
          dossier = "videos-repo/flash"
          os.makedirs(dossier, exist_ok=True)
          shutil.copy2(video, f"{dossier}/{ident}.mp4")
          # ménage : les 12 derniers flashs seulement
          for f in sorted(glob.glob(f"{dossier}/*.mp4"))[:-12]:
              os.remove(f)
          now = datetime.now(timezone.utc)
          titre = ("Flash Info · " + " · ".join(s["titre"] for s in meta["sujets"]))[:80]
          entree = {"id": ident, "titre": titre,
                    "mp4Url": f"https://bastaps.github.io/algeria-tech-videos/flash/{ident}.mp4",
                    "duration": meta["duree"], "publishedAt": now.strftime("%Y-%m-%dT%H:%M:%S.000Z"), "lang": "fr"}
          chemin = "data/flash-latest.json"
          try:
              liste = json.load(open(chemin, encoding="utf-8"))
          except Exception:
              liste = []
          limite = now - timedelta(days=7)
          def recent(e):
              try:
                  return datetime.fromisoformat(e["publishedAt"].replace("Z", "+00:00")) > limite
              except Exception:
                  return False
          liste = [entree] + [e for e in liste if e.get("id") != ident and recent(e)]
          json.dump(liste[:6], open(chemin, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          open("titre.txt", "w", encoding="utf-8").write(titre)
          print("Prêt :", titre)
          EOF
          # dépôt des vidéos : un seul commit (les 12 flashs, les 30 express, la bibliothèque de Rachid)
          cd videos-repo
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git checkout -q --orphan tmp
          git add -A
          git commit -q -m "Vidéos (flash JT) [$(date -u +%Y-%m-%d %H:%M) UTC]"
          git push -q -f origin tmp:main
          cd ..
          # dépôt du site : liste du widget + historique des sujets
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add data/flash-latest.json data/flash-jt-history.json
          git commit -q -m "Auto: flash JT [$(date -u +%H:%M) UTC]" || exit 0
          ok=non
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && ok=oui && break
            sleep 5
          done
          TITRE="$(cat titre.txt)"
          python3 - "$ok" "$TITRE" <<'EOF'
          import os, sys, urllib.request
          ok, titre = sys.argv[1], sys.argv[2]
          if ok == "oui":
              t, m = "✅ Flash publié", f"{titre} — en ligne sur algeria-tech.pages.dev d'ici 3 à 5 min."
          else:
              t, m = "❌ Flash non publié", "L'enregistrement sur GitHub a échoué. Le flash précédent reste en ligne."
          urllib.request.urlopen(urllib.request.Request(f"https://ntfy.sh/{os.environ['CANAL']}", data=m.encode(),
              headers={"Title": t.encode("utf-8")}), timeout=20)
          EOF
          [ "$ok" = "oui" ]
